[package]
name = "minecraft-launcher-classic"
version = "0.1.0"
edition = "2021"
description = "Minecraft Launcher Classic: el launcher original de Minecraft de 2012, funcionando de nuevo con todas las versiones"

# Un solo Minecraft.exe: el launcher original y el servidor local, como el de 2012.
[[bin]]
name = "Minecraft"
path = "src/main.rs"

[dependencies]
axum = "0.8"
# zip's Deflate, with Rust's own backend and without the zopfli compressor.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
lzma-rs = "0.3"
md-5 = "0.10"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
ureq = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[build-dependencies]
embed-resource = "3"
pelite = "0.10"
sha1 = "0.10"

# One self-contained exe to download: smaller, at a slower build.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
